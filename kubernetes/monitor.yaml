apiVersion: v1
kind: Pod
metadata:
  name: monitor-data
spec:
  containers:
    - name: monitor-data
      image: docker.io/kovaleskilab/ml_basic:v4-kube    
      stdin: True
      tty: True
      resources:
        limits:
          memory: 4G
          cpu: 2
        requests:
          memory: 4G
          cpu: 2
      volumeMounts:
        - name: refidx-data
          mountPath: /develop/results
  volumes:
    - name: refidx-data
      persistentVolumeClaim:
        claimName: refidx-data

  restartPolicy: Never

