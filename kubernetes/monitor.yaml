apiVersion: v1
kind: Pod
metadata:
  name: monitor-volume
spec:
  containers:
    - name: monitor-volume
      image: docker.io/kovaleskilab/meep:v3_lightning      
      stdin: True
      tty: True
      resources:
        limits:
          memory: 4G
          cpu: 2
        requests:
          memory: 4G
          cpu: 2
      volumeMounts:
        - name: dft-volumes-refidx
          mountPath: /develop/results
  volumes:
    - name: dft-volumes-refidx
      persistentVolumeClaim:
        claimName: dft-volumes-refidx

  restartPolicy: Never

